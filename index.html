<!DOCTYPE html>
<html lang="ru">
<head>

<body>

            <button class="auth_button">Войти</button>

            <p>Нет аккаунта? <a href="register.html">Регистрация</a></p>
            <p><a href="#">Забыли пароль?</a></p>
